plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore/r0s.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// [add] 只有在 keystore 配置文件存在、且它指向的 keystore 文件真实存在时，
//        才启用自定义签名；否则保留 AGP 内置的默认调试签名（自动使用/生成
//        ~/.android/debug.keystore），从而保证无 keystore 的 CI 环境也能打包。
def hasCustomSigning = false
if (keystorePropsFile.exists() && keystoreProps['storeFile']) {
    hasCustomSigning = file(keystoreProps['storeFile']).exists()
}

android {
    namespace 'com.rosan.accounts'
    compileSdk 33

    defaultConfig {
        applicationId "com.rosan.accounts"
        minSdk 21
        targetSdk 33
        versionCode 7
        versionName "1.5.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        // [add] 只有在 keystore/r0s.properties 存在时才真正创建自定义签名配置；
        // 若不存在（例如 CI 环境），这里不会声明名为 debug 的配置，
        // 从而保留 AGP 内置的默认调试签名（自动使用 ~/.android/debug.keystore）。
        if (hasCustomSigning) {
            debug {
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }

            release {
                keyAlias keystoreProps['keyAlias']
                storePassword keystoreProps['storePassword']
                keyPassword keystoreProps['keyPassword']
                storeFile file(new File(keystoreProps['storeFile']))
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            // [add] 有 keystore 时沿用原自定义签名；否则不挂，由 AGP 使用默认随机调试签名。
            if (hasCustomSigning) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            zipAlignEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            // [add] 同上：keystore 缺失时不挂自定义签名，避免打包 NPE。
            if (hasCustomSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.5'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation platform('androidx.compose:compose-bom:2022.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2022.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    compileOnly project(':hidden-api')

    implementation 'androidx.navigation:navigation-compose:2.6.0'

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    def accompanist_version = '0.30.1'
    implementation "com.google.accompanist:accompanist-drawablepainter:$accompanist_version"
    implementation "com.google.accompanist:accompanist-navigation-animation:$accompanist_version"
    implementation "com.google.accompanist:accompanist-insets:$accompanist_version"
    implementation "com.google.accompanist:accompanist-insets-ui:$accompanist_version"
    implementation "com.google.accompanist:accompanist-systemuicontroller:$accompanist_version"

    implementation 'io.insert-koin:koin-core:3.4.2'
    implementation 'io.insert-koin:koin-android:3.4.2'
    implementation 'io.insert-koin:koin-androidx-compose:3.4.5'

    def shizuku_version = "13.1.4"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
}